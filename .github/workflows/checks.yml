name: checks
on:
  - push
  - pull_request
  - workflow_call

jobs:
  test:
    uses: japa/browser-client/.github/workflows/test.yml@2.x
    with:
      install-playwright-browsers: true

  lint:
    uses: japa/.github/.github/workflows/lint.yml@next

  typecheck:
    uses: japa/.github/.github/workflows/typecheck.yml@next
